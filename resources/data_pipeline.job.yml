resources:
  jobs:
    data_pipeline:
      name: delu-data-pipeline
      description: Retry missing data, build ready days, forecast, and evaluate.
      max_concurrent_runs: 1
      performance_target: STANDARD
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 30 2,10,11,13,15 * * ?"
        timezone_id: Europe/Berlin
        pause_status: ${var.schedule_pause_status}
      parameters:
        - name: start
          default: ""
        - name: end
          default: ""
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: bronze
          environment_key: default
          timeout_seconds: 7200
          python_wheel_task:
            package_name: delu
            entry_point: delu-bronze
            parameters: ["--start", "{{job.parameters.start}}", "--end", "{{job.parameters.end}}"]
        - task_key: silver
          depends_on:
            - task_key: bronze
          run_if: ALL_DONE
          environment_key: default
          timeout_seconds: 1800
          max_retries: 1
          python_wheel_task:
            package_name: delu
            entry_point: delu-silver
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          timeout_seconds: 1800
          max_retries: 1
          python_wheel_task:
            package_name: delu
            entry_point: delu-gold
        - task_key: forecast
          depends_on:
            - task_key: gold
          run_if: ALL_DONE
          environment_key: default
          timeout_seconds: 1800
          max_retries: 1
          python_wheel_task:
            package_name: delu
            entry_point: delu-predict
            parameters: ["--start", "{{job.parameters.start}}", "--end", "{{job.parameters.end}}"]
        - task_key: evaluate
          depends_on:
            - task_key: forecast
          run_if: ALL_DONE
          environment_key: default
          timeout_seconds: 1800
          max_retries: 1
          python_wheel_task:
            package_name: delu
            entry_point: delu-evaluate
            parameters: ["--start", "{{job.parameters.start}}", "--end", "{{job.parameters.end}}"]
