resources:
  jobs:
    settlement:
      name: delu-settlement
      description: Fetch released D SDAC prices at 15:00 and evaluate the forecast.
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0 15 * * ?"
        timezone_id: Europe/Berlin
        pause_status: ${var.schedule_pause_status}
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
        on_duration_warning_threshold_exceeded:
          - ${workspace.current_user.userName}
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: bronze_settlement
          environment_key: default
          timeout_seconds: 1800
          max_retries: 6
          min_retry_interval_millis: 3600000
          retry_on_timeout: true
          python_wheel_task:
            package_name: delu
            entry_point: delu-bronze
            parameters:
              - settlement
              - --run-date
              - "{{job.start_time.iso_date}}"
        - task_key: silver
          depends_on:
            - task_key: bronze_settlement
          environment_key: default
          timeout_seconds: 1800
          max_retries: 1
          python_wheel_task:
            package_name: delu
            entry_point: delu-silver
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          timeout_seconds: 1800
          max_retries: 1
          python_wheel_task:
            package_name: delu
            entry_point: delu-gold
        - task_key: evaluate
          depends_on:
            - task_key: gold
          environment_key: default
          timeout_seconds: 900
          python_wheel_task:
            package_name: delu
            entry_point: delu-evaluate
