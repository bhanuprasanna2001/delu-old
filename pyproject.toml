[project]
name = "delu"
version = "0.1.0"
description = "Day-ahead DE-LU electricity price forecasting on Databricks"
readme = "README.md"
authors = [
    { name = "Bhanu Prasanna", email = "bhanu.prasanna2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "databricks-connect==18.3.4",
    "databricks-sql-connector>=4,<5",
    "entsoe-py>=0.8.1",
    "mlflow>=3.1,<4",
    "numpy>=2,<3",
    "pandas>=2,<3",
    "scikit-learn>=1.9,<2",
]

[project.scripts]
delu = "delu.pipeline.bronze:main"
delu-bronze = "delu.pipeline.bronze:main"
delu-silver = "delu.pipeline.silver:main"
delu-gold = "delu.pipeline.gold:main"
delu-train = "delu.ml.train:main"
delu-predict = "delu.ml.predict:main"
delu-evaluate = "delu.ml.evaluate:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "DTZ", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"
